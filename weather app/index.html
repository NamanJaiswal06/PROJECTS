<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>Weather APP</h1>
        <div class="tab-container">
            <p class="tab" data-userWeather>Your Weather</p>
            <p class="tab" data-searchWeather>Search Weather</p>
        </div>

        <div class="weather-container">
            <div class="sub-container grant-location-container">

                <img src="./Images/location.png" width="80" height="80" loading="lazy">
                <p>grant Location Access</p>
                <p>Allow Access to get Weather Information</p>
                <button class="btn" data-grantAccess>Grant Access</button>

            </div>

            <!--search form-->

            <form class="form-container" data-searchForm>
                <input placeholder="Search for City ..." data-searchInput>
                <button class="btn" type="submit">
                    <img src="./Images/search.png" width="20" heigth="20" loading="lazy">
                </button>
            </form>

            <!--loading screen-->

            <div class=" sub-container loading-container">
                <img src="./Images/loading.gif" width="150" height="150">
                <p>Loading</p>
            </div>

            <!--show weather info-->

            <div class="sub-container user-info-container">
                <div class="name">
                    <p data-cityName>

                    </p>
                    <img data-countryIcon src="">
                </div>
                <p data-weatherDesc></p>
                <img data-weatherIcon src="">

                <p data-temp></p>

                <!--3 CARDS PARAMETER-->

                <div class="parameter-container">
                    <div class="parameter">
                        <img src="./Images/wind.png" >
                        <p>WindSpeed</p>
                        <p data-windspeed></p>
                    </div>

                    <div class="parameter">
                        <img src="./Images/humidity.png" >
                        <p>Humidity</p>
                        <p data-humidity></p>
                    </div>
                    <div class="parameter">
                        <img src="./Images/cloud.png" >
                        <p>Clouds

                        </p>

                        <p data-cloudiness></p>
                    </div>
                </div>

            </div>


        </div>



    </div>


    



    







    <script src="script.js"></script>
</body>
</html>
